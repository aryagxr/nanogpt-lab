[model]
vocab_size = 50304
model_dim = 768
num_layers = 12

[attention]
name = "sdpa"
head_dim = 128
scale = 0.12

[position]
name = "rope"

[norm]
name = "rmsnorm"

[residual]
name = "standard"

[optimizer]
name = "muonh"
lr = 0.018
momentum = 0.95
embed_lr = 0.3
head_lr = 0.003125
scalar_lr = 0.01
betas = [0.8, 0.95]
eps = 1e-10
weight_decay = 0.0

[schedule]
name = "flat_cooldown"

[schedule.cooldown_fraction]
embed = 0.4
head = 0.4
scalar = 0.4
muonh = 1.0

[training]
steps = 3325
batch_tokens = 524288
microbatch_size = 64
sequence_length = 1024
val_tokens = 10485760
val_every = 125

[data]
train = "data/fineweb10B/fineweb_train_*.bin"
val = "data/fineweb10B/fineweb_val_*.bin"
